services:
  omnivoice:
    build:
      context: .
      dockerfile: docker/omnivoice/Dockerfile
      args:
        TORCH_INSTALL_COMMAND: ${OMNIVOICE_TORCH_INSTALL_COMMAND:-pip install --index-url https://download.pytorch.org/whl/cu128 torch==2.8.0+cu128 torchaudio==2.8.0+cu128}
        OMNIVOICE_GIT_REPO: ${OMNIVOICE_GIT_REPO:-https://github.com/k2-fsa/OmniVoice.git}
        OMNIVOICE_GIT_REF: ${OMNIVOICE_GIT_REF:-refs/pull/71/head}
    ports:
      - '8010:8010'
    gpus: all
    environment:
      OMNIVOICE_MODEL: ${OMNIVOICE_MODEL:-k2-fsa/OmniVoice}
      OMNIVOICE_DEVICE: ${OMNIVOICE_DEVICE:-auto}
      OMNIVOICE_DTYPE: ${OMNIVOICE_DTYPE:-auto}
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    volumes:
      - omnivoice-hf-cache:/models/huggingface
    restart: unless-stopped

volumes:
  omnivoice-hf-cache:
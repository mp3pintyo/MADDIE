services:
  omnivoice:
    build:
      context: .
      dockerfile: docker/omnivoice/Dockerfile
      args:
        TORCH_INSTALL_COMMAND: ${OMNIVOICE_TORCH_INSTALL_COMMAND:-pip install torch==2.8.0 torchaudio==2.8.0}
    ports:
      - '8010:8010'
    environment:
      OMNIVOICE_MODEL: ${OMNIVOICE_MODEL:-k2-fsa/OmniVoice}
      OMNIVOICE_DEVICE: ${OMNIVOICE_DEVICE:-cpu}
      OMNIVOICE_DTYPE: ${OMNIVOICE_DTYPE:-float32}
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
    volumes:
      - omnivoice-hf-cache:/models/huggingface
    restart: unless-stopped

volumes:
  omnivoice-hf-cache: